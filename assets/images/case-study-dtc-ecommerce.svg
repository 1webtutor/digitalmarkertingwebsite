<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="dtcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0B14"/>
      <stop offset="50%" stop-color="#181324"/>
      <stop offset="100%" stop-color="#0B0910"/>
    </linearGradient>

    <!-- DTC Radiant Amber & Gold Gradients -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <linearGradient id="goldTextGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>

    <linearGradient id="cardGradDtc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>

    <linearGradient id="dtcCurve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="dtcArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="dtcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="800" height="520" rx="16" fill="url(#dtcBg)"/>

  <!-- Subtle E-Commerce Grid -->
  <g stroke="rgba(245,158,11,0.07)" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="520"/>
    <line x1="200" y1="0" x2="200" y2="520"/>
    <line x1="400" y1="0" x2="400" y2="520"/>
    <line x1="600" y1="0" x2="600" y2="520"/>
    <line x1="760" y1="0" x2="760" y2="520"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="260" x2="800" y2="260"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="700" cy="110" r="140" fill="#F59E0B" opacity="0.08" filter="url(#dtcGlow)"/>
  <circle cx="120" cy="420" r="150" fill="#8B5CF6" opacity="0.06" filter="url(#dtcGlow)"/>

  <!-- Clean Header Bar -->
  <g transform="translate(40, 36)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="154" height="28" rx="14" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.4)" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#F59E0B"/>
    <text x="26" y="18" fill="#FDE68A" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" letter-spacing="1">DTC E-COMMERCE</text>

    <!-- Shopify Plus Verified Tag -->
    <rect x="166" y="0" width="168" height="28" rx="14" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
    <path d="M180 14l3 3 6-6" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="196" y="18" fill="#10B981" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">SHOPIFY ATTRIBUTION</text>

    <!-- Scale Timeline -->
    <text x="720" y="18" text-anchor="end" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">6 Months Velocity Scale</text>
  </g>

  <!-- Campaign Title -->
  <text x="40" y="105" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
    Kaveri Organics <tspan fill="url(#amberGrad)">· ₹4.5L to ₹48.2L / Mo Scale</tspan>
  </text>
  <text x="40" y="128" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">
    Meta Advantage+ UGC Matrix + 1-Click Fast Checkout + WhatsApp Abandoned Cart Engine
  </text>

  <!-- 3 Clean KPI Cards Row -->
  <g transform="translate(40, 155)">
    <!-- KPI Card 1: Revenue -->
    <rect x="0" y="0" width="226" height="110" rx="14" fill="url(#cardGradDtc)" stroke="rgba(245,158,11,0.3)" stroke-width="1.2"/>
    <text x="20" y="32" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">Scaled Monthly Revenue</text>
    <text x="20" y="74" fill="url(#amberGrad)" font-family="'Outfit', sans-serif" font-size="34" font-weight="900">₹48.2 Lakhs</text>
    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="102" height="16" rx="8" fill="rgba(16,185,129,0.18)"/>
      <text x="8" y="12" fill="#10B981" font-family="'Outfit', sans-serif" font-size="10" font-weight="800">▲ 10.6X MULTIPLIER</text>
    </g>

    <!-- KPI Card 2: ROAS -->
    <rect x="246" y="0" width="226" height="110" rx="14" fill="url(#cardGradDtc)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <text x="266" y="32" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">Blended ROAS</text>
    <text x="266" y="74" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="34" font-weight="900">4.82x</text>
    <g transform="translate(266, 88)">
      <rect x="0" y="0" width="112" height="16" rx="8" fill="rgba(212,175,55,0.15)"/>
      <text x="8" y="12" fill="#F3E5AB" font-family="'Outfit', sans-serif" font-size="10" font-weight="800">★ SCALED PROFITABLY</text>
    </g>

    <!-- KPI Card 3: Cart Recovery -->
    <rect x="492" y="0" width="228" height="110" rx="14" fill="url(#cardGradDtc)" stroke="rgba(16,185,129,0.3)" stroke-width="1.2"/>
    <text x="512" y="32" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">Abandoned Cart Winback</text>
    <text x="512" y="74" fill="url(#goldTextGrad3)" font-family="'Outfit', sans-serif" font-size="34" font-weight="900">24.2%</text>
    <g transform="translate(512, 88)">
      <rect x="0" y="0" width="118" height="16" rx="8" fill="rgba(16,185,129,0.18)"/>
      <text x="8" y="12" fill="#10B981" font-family="'Outfit', sans-serif" font-size="10" font-weight="800">● VIA WHATSAPP FLOWS</text>
    </g>
  </g>

  <!-- Clean Chart Area -->
  <g transform="translate(40, 285)">
    <rect x="0" y="0" width="720" height="175" rx="14" fill="url(#cardGradDtc)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Chart Header -->
    <text x="24" y="30" fill="#F8FAFC" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">Monthly Revenue Scaling Curve (₹ Lakhs)</text>
    <text x="696" y="30" text-anchor="end" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Shopify Analytics + Meta CAPI</text>

    <!-- Smooth Chart Area & Curve -->
    <path d="M 30 145 Q 160 138 280 110 T 520 50 T 690 26 L 690 145 Z" fill="url(#dtcArea)"/>
    <path d="M 30 145 Q 160 138 280 110 T 520 50 T 690 26" fill="none" stroke="url(#dtcCurve)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Key Milestone Pulse Dots -->
    <circle cx="30" cy="145" r="5" fill="#64748B" stroke="#FFFFFF" stroke-width="2"/>
    <text x="45" y="138" fill="#94A3B8" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">₹4.5L</text>

    <circle cx="280" cy="110" r="5" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="2"/>
    <text x="280" y="96" text-anchor="middle" fill="#C4B5FD" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">₹12.4L</text>

    <circle cx="520" cy="50" r="5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
    <text x="520" y="36" text-anchor="middle" fill="#FDE68A" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">₹29.8L</text>

    <circle cx="690" cy="26" r="6" fill="#FDE68A" stroke="#F59E0B" stroke-width="2.5"/>
    <text x="680" y="15" text-anchor="end" fill="#FDE68A" font-family="'Outfit', sans-serif" font-size="13" font-weight="800">₹48.2L / Mo ✦</text>

    <!-- Axis Labels -->
    <line x1="30" y1="145" x2="690" y2="145" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="30" y="162" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Month 1 (Baseline)</text>
    <text x="280" y="162" text-anchor="middle" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Month 3 (UGC Hook Testing)</text>
    <text x="520" y="162" text-anchor="middle" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Month 5 (1-Click Checkout Scale)</text>
    <text x="690" y="162" text-anchor="end" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">10.6x Achieved ✦</text>
  </g>

  <!-- Clean Bottom Architecture Tags -->
  <g transform="translate(40, 482)">
    <text x="0" y="15" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">STACK:</text>
    <rect x="48" y="0" width="102" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="99" y="15" text-anchor="middle" fill="#CBD5E1" font-family="'Outfit', sans-serif" font-size="10" font-weight="600">Shopify Plus</text>

    <rect x="158" y="0" width="124" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="220" y="15" text-anchor="middle" fill="#CBD5E1" font-family="'Outfit', sans-serif" font-size="10" font-weight="600">Meta Advantage+</text>

    <rect x="290" y="0" width="138" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="359" y="15" text-anchor="middle" fill="#CBD5E1" font-family="'Outfit', sans-serif" font-size="10" font-weight="600">WhatsApp Flow AI</text>

    <rect x="436" y="0" width="134" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="503" y="15" text-anchor="middle" fill="#CBD5E1" font-family="'Outfit', sans-serif" font-size="10" font-weight="600">UGC Creative Matrix</text>

    <text x="720" y="15" text-anchor="end" fill="#F59E0B" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">VERIFIED ATTRIBUTION ✦</text>
  </g>
</svg>