<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="realBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>

    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F3E5AB"/>
    </linearGradient>

    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="800" height="520" rx="16" fill="url(#realBg)"/>
  
  <!-- Subtle Background Grid -->
  <g stroke="rgba(212,175,55,0.06)" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="520"/>
    <line x1="200" y1="0" x2="200" y2="520"/>
    <line x1="400" y1="0" x2="400" y2="520"/>
    <line x1="600" y1="0" x2="600" y2="520"/>
    <line x1="760" y1="0" x2="760" y2="520"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="260" x2="800" y2="260"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="700" cy="100" r="140" fill="#D4AF37" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="120" cy="420" r="160" fill="#10B981" opacity="0.05" filter="url(#softGlow)"/>

  <!-- Clean Header Bar -->
  <g transform="translate(40, 36)">
    <!-- Brand & Category -->
    <rect x="0" y="0" width="136" height="28" rx="14" fill="rgba(212,175,55,0.12)" stroke="rgba(212,175,55,0.4)" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#D4AF37"/>
    <text x="26" y="18" fill="#F3E5AB" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" letter-spacing="1">REAL ESTATE HNI</text>

    <!-- Meta CAPI Verified Tag -->
    <rect x="148" y="0" width="154" height="28" rx="14" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
    <path d="M162 14l3 3 6-6" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="178" y="18" fill="#10B981" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">META CAPI VERIFIED</text>

    <!-- Quarter Duration -->
    <text x="720" y="18" text-anchor="end" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">Q3-Q4 Growth Cycle · 90 Days</text>
  </g>

  <!-- Campaign Title -->
  <text x="40" y="105" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
    Aura Luxury Villas <tspan fill="url(#goldTextGrad)">· ₹14.8 Cr Acquisition Scale</tspan>
  </text>
  <text x="40" y="128" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">
    High-Net-Worth Meta Ads + WhatsApp VIP Concierge + Automated Site Visit Booking Engine
  </text>

  <!-- 3 Clean KPI Cards Row -->
  <g transform="translate(40, 155)">
    <!-- KPI Card 1: Revenue -->
    <rect x="0" y="0" width="226" height="110" rx="14" fill="url(#cardGrad)" stroke="rgba(212,175,55,0.3)" stroke-width="1.2"/>
    <text x="20" y="32" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">Total Property Sales</text>
    <text x="20" y="74" fill="url(#goldTextGrad)" font-family="'Outfit', sans-serif" font-size="34" font-weight="900">₹14.8 Cr</text>
    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="94" height="16" rx="8" fill="rgba(16,185,129,0.15)"/>
      <text x="8" y="12" fill="#10B981" font-family="'Outfit', sans-serif" font-size="10" font-weight="800">▲ +310% QUARTER</text>
    </g>

    <!-- KPI Card 2: ROAS -->
    <rect x="246" y="0" width="226" height="110" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <text x="266" y="32" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">Blended ROAS</text>
    <text x="266" y="74" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="34" font-weight="900">4.20x</text>
    <g transform="translate(266, 88)">
      <rect x="0" y="0" width="108" height="16" rx="8" fill="rgba(212,175,55,0.15)"/>
      <text x="8" y="12" fill="#F3E5AB" font-family="'Outfit', sans-serif" font-size="10" font-weight="800">★ VERIFIED RETURN</text>
    </g>

    <!-- KPI Card 3: Site Visits -->
    <rect x="492" y="0" width="228" height="110" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <text x="512" y="32" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">Private Site Visits</text>
    <text x="512" y="74" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="34" font-weight="900">85 Visits</text>
    <g transform="translate(512, 88)">
      <rect x="0" y="0" width="114" height="16" rx="8" fill="rgba(16,185,129,0.15)"/>
      <text x="8" y="12" fill="#10B981" font-family="'Outfit', sans-serif" font-size="10" font-weight="800">● 100% PRE-QUALIFIED</text>
    </g>
  </g>

  <!-- Clean Chart & Architecture Area -->
  <g transform="translate(40, 285)">
    <rect x="0" y="0" width="720" height="175" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Chart Header -->
    <text x="24" y="30" fill="#F8FAFC" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">Cumulative Sales Velocity (₹ Crores)</text>
    <text x="696" y="30" text-anchor="end" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Meta CAPI Attribution</text>

    <!-- Smooth Chart Area & Curve -->
    <path d="M 30 145 Q 160 140 280 115 T 520 55 T 690 32 L 690 145 Z" fill="url(#areaGrad)"/>
    <path d="M 30 145 Q 160 140 280 115 T 520 55 T 690 32" fill="none" stroke="url(#curveGrad)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Key Milestone Pulse Dots -->
    <circle cx="280" cy="115" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
    <text x="280" y="100" text-anchor="middle" fill="#94A3B8" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">₹3.2 Cr</text>

    <circle cx="520" cy="55" r="5" fill="#D4AF37" stroke="#FFFFFF" stroke-width="2"/>
    <text x="520" y="42" text-anchor="middle" fill="#F3E5AB" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">₹9.6 Cr</text>

    <circle cx="690" cy="32" r="6" fill="#FFF2B2" stroke="#D4AF37" stroke-width="2.5"/>
    <text x="680" y="20" text-anchor="end" fill="#FFF2B2" font-family="'Outfit', sans-serif" font-size="13" font-weight="800">₹14.8 Cr Final</text>

    <!-- Axis Labels -->
    <line x1="30" y1="145" x2="690" y2="145" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="30" y="162" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Month 1 (Kickoff)</text>
    <text x="280" y="162" text-anchor="middle" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Month 2 (Creative VSL Scale)</text>
    <text x="520" y="162" text-anchor="middle" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Month 3 (WhatsApp Fast-Track)</text>
    <text x="690" y="162" text-anchor="end" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Goal Surpassed ✦</text>
  </g>

  <!-- Clean Bottom Architecture Tags -->
  <g transform="translate(40, 482)">
    <text x="0" y="15" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">STACK:</text>
    <rect x="48" y="0" width="112" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="104" y="15" text-anchor="middle" fill="#CBD5E1" font-family="'Outfit', sans-serif" font-size="10" font-weight="600">Meta Advantage+</text>

    <rect x="168" y="0" width="128" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="232" y="15" text-anchor="middle" fill="#CBD5E1" font-family="'Outfit', sans-serif" font-size="10" font-weight="600">WhatsApp Cloud API</text>

    <rect x="304" y="0" width="138" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="373" y="15" text-anchor="middle" fill="#CBD5E1" font-family="'Outfit', sans-serif" font-size="10" font-weight="600">Sub-Second Microsite</text>

    <rect x="450" y="0" width="104" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="502" y="15" text-anchor="middle" fill="#CBD5E1" font-family="'Outfit', sans-serif" font-size="10" font-weight="600">HighLevel CRM</text>

    <text x="720" y="15" text-anchor="end" fill="#D4AF37" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">VERIFIED ATTRIBUTION ✦</text>
  </g>
</svg>