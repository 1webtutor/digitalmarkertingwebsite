    <circle cx="220" cy="100" r="4" fill="#D4AF37" stroke="#0D1117" stroke-width="2"/>
    <circle cx="320" cy="65" r="4" fill="#D4AF37" stroke="#0D1117" stroke-width="2"/>
    <circle cx="435" cy="45" r="5" fill="#FFF" stroke="#D4AF37" stroke-width="2"/>

    <!-- Months labels -->
    <text x="25" y="172" fill="#64748B" font-size="10">Day 1 (Audit)</text>
    <text x="130" y="172" fill="#64748B" font-size="10">Day 25</text>
    <text x="220" y="172" fill="#64748B" font-size="10">Day 50</text>
    <text x="320" y="172" fill="#64748B" font-size="10">Day 75</text>
    <text x="400" y="172" fill="#D4AF37" font-weight="700" font-size="10">Day 90 (Peak)</text>
  </g>

  <!-- Funnel Breakdown Box -->
  <g transform="translate(500, 160)">
    <rect x="0" y="0" width="276" height="180" rx="10" fill="#161C28" stroke="#263147" stroke-width="1"/>
    <text x="16" y="28" fill="#FFFFFF" font-size="13" font-weight="700">Acquisition Funnel Velocity</text>
    
