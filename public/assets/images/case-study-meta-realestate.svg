    <rect x="16" y="139" width="244" height="6" rx="3" fill="#222B3D"/>
    <rect x="16" y="139" width="110" height="6" rx="3" fill="#10B981"/>

    <text x="16" y="165" fill="#D4AF37" font-weight="700" font-size="11">Executive Site Visits Booked: 85 (10% CVR)</text>
  </g>

  <!-- Live Ad Campaign Rows Table -->
  <g transform="translate(24, 355)">
    <rect x="0" y="0" width="752" height="120" rx="10" fill="#161C28" stroke="#263147" stroke-width="1"/>
    
    <!-- Table Header -->
    <rect x="0" y="0" width="752" height="32" rx="10" fill="#1F2839"/>
    <text x="16" y="21" fill="#94A3B8" font-size="11" font-weight="700">CAMPAIGN NAME</text>
    <text x="260" y="21" fill="#94A3B8" font-size="11" font-weight="700">ATTRIBUTION</text>
    <text x="380" y="21" fill="#94A3B8" font-size="11" font-weight="700">SPEND</text>
    <text x="470" y="21" fill="#94A3B8" font-size="11" font-weight="700">CTR</text>
    <text x="560" y="21" fill="#94A3B8" font-size="11" font-weight="700">QUALIFIED LEADS</text>
    <text x="690" y="21" fill="#94A3B8" font-size="11" font-weight="700">ROAS</text>

    <!-- Row 1 -->
    <text x="16" y="58" fill="#FFF" font-size="12" font-weight="600">Aura_Luxury_Villas_CAPI_HNI_Advantage+</text>
    <text x="260" y="58" fill="#10B981" font-size="11" font-weight="700">✓ Server-Side CAPI</text>
    <text x="380" y="58" fill="#E2E8F0" font-size="12">₹1,85,400</text>
    <text x="470" y="58" fill="#10B981" font-size="12" font-weight="700">3.84%</text>
    <text x="560" y="58" fill="#E2E8F0" font-size="12">480 Inquiries</text>
    <text x="690" y="58" fill="#D4AF37" font-size="13" font-weight="800">4.6x</text>

    <!-- Row 2 -->
    <line x1="0" y1="75" x2="752" y2="75" stroke="#263147" stroke-width="1"/>
    <text x="16" y="100" fill="#FFF" font-size="12" font-weight="600">Aura_Retargeting_VSL_Walkthrough_Video</text>
    <text x="260" y="100" fill="#10B981" font-size="11" font-weight="700">✓ 8-Sec Hook Matrix</text>
    <text x="380" y="100" fill="#E2E8F0" font-size="12">₹1,66,600</text>
    <text x="470" y="100" fill="#10B981" font-size="12" font-weight="700">4.12%</text>
    <text x="560" y="100" fill="#E2E8F0" font-size="12">370 Inquiries</text>
    <text x="690" y="100" fill="#D4AF37" font-size="13" font-weight="800">3.8x</text>
  </g>
</svg>