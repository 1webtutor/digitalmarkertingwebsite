    <line x1="20" y1="95" x2="440" y2="95" stroke="#263147" stroke-dasharray="3,3"/>
    <line x1="20" y1="135" x2="440" y2="135" stroke="#263147" stroke-dasharray="3,3"/>

    <!-- Chart Fill Area -->
    <path d="M 25 150 Q 80 145 130 130 T 220 100 T 320 65 T 435 45 L 435 160 L 25 160 Z" fill="url(#chartFill)"/>
    <!-- Chart Stroke -->
    <path d="M 25 150 Q 80 145 130 130 T 220 100 T 320 65 T 435 45" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linecap="round"/>

    <!-- Points -->
