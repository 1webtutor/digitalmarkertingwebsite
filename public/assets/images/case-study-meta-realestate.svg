<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="background:#0D1117; font-family:'Outfit',-apple-system,sans-serif;">
  <defs>
    <linearGradient id="metaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <linearGradient id="chartFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect x="0" y="0" width="800" height="500" fill="#0A0D14"/>
  <rect x="0" y="0" width="800" height="42" fill="#141923" stroke="#222A38" stroke-width="1"/>
  <circle cx="24" cy="21" r="5.5" fill="#EF4444"/>
  <circle cx="42" cy="21" r="5.5" fill="#F59E0B"/>
  <circle cx="60" cy="21" r="5.5" fill="#10B981"/>
  
  <text x="82" y="25" fill="#94A3B8" font-size="12" font-weight="600" letter-spacing="0.5">Meta Ads Manager · Aura Luxury Villas Campaign Dashboard (Verified CAPI)</text>
  <rect x="660" y="10" width="120" height="22" rx="11" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="1"/>
  <circle cx="673" cy="21" r="3.5" fill="#10B981"/>
  <text x="684" y="25" fill="#10B981" font-size="11" font-weight="700">● LIVE ACTIVE</text>

  <!-- Metric KPI Cards Row -->
  <g transform="translate(24, 60)">
    <!-- KPI 1 -->
    <rect x="0" y="0" width="176" height="84" rx="10" fill="#161C28" stroke="#263147" stroke-width="1"/>
    <text x="16" y="26" fill="#94A3B8" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Total Property Sales</text>
    <text x="16" y="58" fill="url(#metaGold)" font-size="24" font-weight="800">₹14.8 Cr</text>
    <text x="16" y="74" fill="#10B981" font-size="11" font-weight="700">↑ 310% vs Prior Qtr</text>

    <!-- KPI 2 -->
    <rect x="192" y="0" width="176" height="84" rx="10" fill="#161C28" stroke="#263147" stroke-width="1"/>
    <text x="208" y="26" fill="#94A3B8" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Blended ROAS</text>
    <text x="208" y="58" fill="#FFFFFF" font-size="24" font-weight="800">4.20x</text>
    <text x="208" y="74" fill="#10B981" font-size="11" font-weight="700">High-Intent HNI Traffic</text>

    <!-- KPI 3 -->
    <rect x="384" y="0" width="176" height="84" rx="10" fill="#161C28" stroke="#263147" stroke-width="1"/>
    <text x="400" y="26" fill="#94A3B8" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Site Visit Bookings</text>
    <text x="400" y="58" fill="#F3E5AB" font-size="24" font-weight="800">85 Visits</text>
    <text x="400" y="74" fill="#10B981" font-size="11" font-weight="700">Automated WhatsApp</text>

    <!-- KPI 4 -->
    <rect x="576" y="0" width="176" height="84" rx="10" fill="#161C28" stroke="#263147" stroke-width="1"/>
    <text x="592" y="26" fill="#94A3B8" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="0.5">Cost Per Lead (CPL)</text>
    <text x="592" y="58" fill="#FFFFFF" font-size="24" font-weight="800">-48.2%</text>
    <text x="592" y="74" fill="#10B981" font-size="11" font-weight="700">Down from ₹8,200</text>
