    <text x="220" y="95" fill="#FFF" font-size="11" font-weight="700">48,200</text>
    <rect x="16" y="102" width="244" height="6" rx="3" fill="#222B3D"/>
    <rect x="16" y="102" width="180" height="6" rx="3" fill="#D4AF37"/>

