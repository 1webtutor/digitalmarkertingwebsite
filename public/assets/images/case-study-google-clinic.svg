    <text x="260" y="58" fill="#D4AF37" font-size="11" font-weight="700">Bottom of Funnel</text>
    <text x="380" y="58" fill="#E2E8F0" font-size="12">14,280</text>
    <text x="480" y="58" fill="#10B981" font-size="12" font-weight="700">410 Calls</text>
    <text x="590" y="58" fill="#E2E8F0" font-size="12">₹390 / appt</text>
    <text x="690" y="58" fill="#10B981" font-size="12" font-weight="800">● 100% SLA</text>

    <!-- Row 2 -->
    <line x1="0" y1="75" x2="752" y2="75" stroke="#263147" stroke-width="1"/>
    <text x="16" y="100" fill="#FFF" font-size="12" font-weight="600">Google_Maps_Promoted_Pin_Salem_CityWide</text>
    <text x="260" y="100" fill="#60A5FA" font-size="11" font-weight="700">Map 3-Pack Local</text>
    <text x="380" y="100" fill="#E2E8F0" font-size="12">28,500</text>
    <text x="480" y="100" fill="#10B981" font-size="12" font-weight="700">620 Directions</text>
    <text x="590" y="100" fill="#E2E8F0" font-size="12">₹210 / action</text>
    <text x="690" y="100" fill="#10B981" font-size="12" font-weight="800">● Scaled</text>
