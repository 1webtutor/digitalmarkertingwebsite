    <text x="16" y="21" fill="#94A3B8" font-size="11" font-weight="700">CAMPAIGN / ASSET</text>
    <text x="260" y="21" fill="#94A3B8" font-size="11" font-weight="700">INTENT LEVEL</text>
    <text x="380" y="21" fill="#94A3B8" font-size="11" font-weight="700">IMPRESSIONS</text>
    <text x="480" y="21" fill="#94A3B8" font-size="11" font-weight="700">PHONE CALLS</text>
    <text x="590" y="21" fill="#94A3B8" font-size="11" font-weight="700">CAC PER APPT</text>
