    <text x="235" y="172" fill="#64748B" font-size="10">Month 4 (115)</text>
    <text x="335" y="172" fill="#64748B" font-size="10">Month 5 (152)</text>
    <text x="395" y="172" fill="#10B981" font-weight="700" font-size="10">Month 6 (185+)</text>
