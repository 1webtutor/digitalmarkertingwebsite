<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="clinicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08141B"/>
      <stop offset="50%" stop-color="#0E232B"/>
      <stop offset="100%" stop-color="#060F14"/>
    </linearGradient>

    <!-- Clinic Emerald Gradients -->
    <linearGradient id="emeraldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="goldTextGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF2B2"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>

    <linearGradient id="cardGradClinic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>

    <linearGradient id="clinicCurve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="clinicArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="clinicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Clean Canvas Base -->
  <rect width="800" height="520" rx="16" fill="url(#clinicBg)"/>

  <!-- Subtle Medical Crosshair & Radial Grid -->
  <g stroke="rgba(16,185,129,0.07)" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="520"/>
    <line x1="200" y1="0" x2="200" y2="520"/>
    <line x1="400" y1="0" x2="400" y2="520"/>
    <line x1="600" y1="0" x2="600" y2="520"/>
    <line x1="760" y1="0" x2="760" y2="520"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="260" x2="800" y2="260"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="720" cy="120" r="150" fill="#10B981" opacity="0.09" filter="url(#clinicGlow)"/>
  <circle cx="100" cy="400" r="140" fill="#06B6D4" opacity="0.06" filter="url(#clinicGlow)"/>

  <!-- Clean Header Bar -->
  <g transform="translate(40, 36)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="168" height="28" rx="14" fill="rgba(16,185,129,0.14)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#10B981"/>
    <text x="26" y="18" fill="#A7F3D0" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" letter-spacing="1">HEALTHCARE &amp; CLINIC</text>

    <!-- Google 3-Pack Verified Badge -->
    <rect x="180" y="0" width="170" height="28" rx="14" fill="rgba(212,175,55,0.12)" stroke="rgba(212,175,55,0.4)" stroke-width="1"/>
    <path d="M194 14l3 3 6-6" stroke="#D4AF37" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="210" y="18" fill="#F3E5AB" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">GOOGLE 3-PACK #1 RANK</text>

    <!-- Time Period -->
    <text x="720" y="18" text-anchor="end" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600">6 Months Organic + PPC Scale</text>
  </g>

  <!-- Campaign Title -->
  <text x="40" y="105" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
    Dr. Nivedha Aesthetics <tspan fill="url(#emeraldTextGrad)">· 185+ Monthly Consultations</tspan>
  </text>
  <text x="40" y="128" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500">
    Google Local 3-Pack SEO + High-Intent Search Ads + WhatsApp Automated Patient Booking
  </text>

  <!-- 3 Clean KPI Cards Row -->
  <g transform="translate(40, 155)">
    <!-- KPI Card 1: Consultations -->
    <rect x="0" y="0" width="226" height="110" rx="14" fill="url(#cardGradClinic)" stroke="rgba(16,185,129,0.3)" stroke-width="1.2"/>
    <text x="20" y="32" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">Monthly Patients</text>
    <text x="20" y="74" fill="url(#emeraldTextGrad)" font-family="'Outfit', sans-serif" font-size="34" font-weight="900">185+ / Mo</text>
    <g transform="translate(20, 88)">
      <rect x="0" y="0" width="102" height="16" rx="8" fill="rgba(16,185,129,0.18)"/>
      <text x="8" y="12" fill="#10B981" font-family="'Outfit', sans-serif" font-size="10" font-weight="800">▲ +386% FROM 38/MO</text>
    </g>

    <!-- KPI Card 2: CAC Reduction -->
    <rect x="246" y="0" width="226" height="110" rx="14" fill="url(#cardGradClinic)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <text x="266" y="32" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">Cost Per Consultation</text>
    <text x="266" y="74" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="34" font-weight="900">-62.4%</text>
    <g transform="translate(266, 88)">
      <rect x="0" y="0" width="104" height="16" rx="8" fill="rgba(16,185,129,0.15)"/>
      <text x="8" y="12" fill="#10B981" font-family="'Outfit', sans-serif" font-size="10" font-weight="800">▼ ₹1,850 ➔ ₹695 CAC</text>
    </g>

    <!-- KPI Card 3: Google Map Pack -->
    <rect x="492" y="0" width="228" height="110" rx="14" fill="url(#cardGradClinic)" stroke="rgba(212,175,55,0.3)" stroke-width="1.2"/>
    <text x="512" y="32" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" text-transform="uppercase" letter-spacing="1">Local Search Authority</text>
    <text x="512" y="74" fill="url(#goldTextGrad2)" font-family="'Outfit', sans-serif" font-size="34" font-weight="900">#1 Rank</text>
    <g transform="translate(512, 88)">
      <rect x="0" y="0" width="112" height="16" rx="8" fill="rgba(212,175,55,0.15)"/>
      <text x="8" y="12" fill="#F3E5AB" font-family="'Outfit', sans-serif" font-size="10" font-weight="800">★ 4.9★ (320+ REVIEWS)</text>
    </g>
  </g>

  <!-- Clean Chart Area -->
  <g transform="translate(40, 285)">
    <rect x="0" y="0" width="720" height="175" rx="14" fill="url(#cardGradClinic)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Chart Title -->
    <text x="24" y="30" fill="#F8FAFC" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">Monthly Confirmed Patient Bookings</text>
    <text x="696" y="30" text-anchor="end" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Google Ads &amp; Maps GMB Insights</text>

    <!-- Smooth Chart Area & Curve -->
    <path d="M 30 145 Q 150 135 270 95 T 510 52 T 690 28 L 690 145 Z" fill="url(#clinicArea)"/>
    <path d="M 30 145 Q 150 135 270 95 T 510 52 T 690 28" fill="none" stroke="url(#clinicCurve)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Key Milestone Pulse Dots -->
    <circle cx="30" cy="145" r="5" fill="#64748B" stroke="#FFFFFF" stroke-width="2"/>
    <text x="45" y="138" fill="#94A3B8" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">38</text>

    <circle cx="270" cy="95" r="5" fill="#06B6D4" stroke="#FFFFFF" stroke-width="2"/>
    <text x="270" y="80" text-anchor="middle" fill="#A7F3D0" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">76 / mo</text>

    <circle cx="510" cy="52" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
    <text x="510" y="38" text-anchor="middle" fill="#A7F3D0" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">142 / mo</text>

    <circle cx="690" cy="28" r="6" fill="#A7F3D0" stroke="#10B981" stroke-width="2.5"/>
    <text x="680" y="16" text-anchor="end" fill="#A7F3D0" font-family="'Outfit', sans-serif" font-size="13" font-weight="800">185+ Capacity ✦</text>

    <!-- Axis Labels -->
    <line x1="30" y1="145" x2="690" y2="145" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="30" y="162" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Baseline</text>
    <text x="270" y="162" text-anchor="middle" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Month 2 (GMB 3-Pack Optimization)</text>
    <text x="510" y="162" text-anchor="middle" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Month 4 (Search Intent PPC)</text>
    <text x="690" y="162" text-anchor="end" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Calendar Full ✦</text>
  </g>

  <!-- Clean Bottom Architecture Tags -->
  <g transform="translate(40, 482)">
    <text x="0" y="15" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">STACK:</text>
    <rect x="48" y="0" width="118" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="107" y="15" text-anchor="middle" fill="#CBD5E1" font-family="'Outfit', sans-serif" font-size="10" font-weight="600">Google Local 3-Pack</text>

    <rect x="174" y="0" width="118" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="233" y="15" text-anchor="middle" fill="#CBD5E1" font-family="'Outfit', sans-serif" font-size="10" font-weight="600">Google Search PPC</text>

    <rect x="300" y="0" width="138" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="369" y="15" text-anchor="middle" fill="#CBD5E1" font-family="'Outfit', sans-serif" font-size="10" font-weight="600">WhatsApp Auto-Booking</text>

    <rect x="446" y="0" width="108" height="22" rx="11" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <text x="500" y="15" text-anchor="middle" fill="#CBD5E1" font-family="'Outfit', sans-serif" font-size="10" font-weight="600">5-Star Review Bot</text>

    <text x="720" y="15" text-anchor="end" fill="#10B981" font-family="'Outfit', sans-serif" font-size="11" font-weight="700">VERIFIED ATTRIBUTION ✦</text>
  </g>
</svg>