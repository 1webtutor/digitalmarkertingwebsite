<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" class="vy-logo-svg">
  <defs>
    <!-- Metallic Gold Base Gradient -->
    <linearGradient id="vyGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CA65" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#FFF4D0" />
      <stop offset="75%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <!-- Champagne Gold Highlight Gradient -->
    <linearGradient id="vyChampagneGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#996515" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Deep Gold Shadow Gradient -->
    <linearGradient id="vyDeepGold" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#7A5210" />
    </linearGradient>

    <!-- Specular Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luxury Outer Hex/Shield Ring (Subtle Deep Gold) -->
  <polygon points="60,8 106,34 106,86 60,112 14,86 14,34" 
           stroke="url(#vyDeepGold)" stroke-width="1.5" stroke-dasharray="4 2" fill="none" opacity="0.45" />

  <!-- Inner Geometric Guide Circle -->
  <circle cx="60" cy="60" r="48" stroke="url(#vyGoldGrad)" stroke-width="0.8" opacity="0.3" fill="none" />

  <!-- INTERLOCKING GEOMETRIC 'V' AND 'Y' MONOGRAM -->
  <g filter="url(#goldGlow)">
    <!-- 'V' Letterform - Bold Precision Prisms -->
    <!-- Left diagonal arm of V -->
    <polygon points="26,24 38,24 60,78 48,78" fill="url(#vyGoldGrad)" />
    <!-- Right diagonal arm of V -->
    <polygon points="94,24 82,24 60,78 72,78" fill="url(#vyChampagneGrad)" />
    
    <!-- 'V' Inner chamfer highlight -->
    <polygon points="48,78 60,78 72,78 60,84" fill="url(#vyDeepGold)" />

    <!-- 'Y' Letterform - Interlocking diagonally and descending through V -->
    <!-- Left upper arm of Y (crosses behind V left arm, comes into center) -->
    <polygon points="34,36 44,24 60,54 50,60" fill="url(#vyChampagneGrad)" opacity="0.95" />
    <!-- Right upper arm of Y (crosses in front of V right arm) -->
    <polygon points="86,36 76,24 60,54 70,60" fill="url(#vyGoldGrad)" />

    <!-- Interlocking Junction Overlap Diamond -->
    <polygon points="60,48 68,60 60,72 52,60" fill="url(#vyChampagneGrad)" />

    <!-- Vertical Stem of Y (descends through and below the V vertex) -->
    <polygon points="56,66 64,66 64,100 56,100" fill="url(#vyGoldGrad)" />
    <polygon points="56,100 64,100 60,105" fill="url(#vyDeepGold)" />

    <!-- Center Specular Gem Accent -->
    <circle cx="60" cy="60" r="2.2" fill="#FFFFFF" />
  </g>
</svg>